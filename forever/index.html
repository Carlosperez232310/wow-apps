<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forever Hunter — WoW: Forever quest map &amp; beast Pokédex</title>
<meta name="description" content="Fan-made WoW: Forever Hunter companion: quest map with gear, class/pet and ranged-weapon quests, and a tameable beast Pokédex.">
<meta name="theme-color" content="#1a150f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <img class="logo" src="icons/icon-192.png" alt="">
  <div><h1>Forever Hunter</h1><div class="sub">WoW: Forever companion · beta data</div></div>
  <div class="grow"></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button data-view="quests" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Quests</button>
    <button data-view="beasts" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="9" rx="2.2" ry="3"/><ellipse cx="10" cy="5.5" rx="2.2" ry="3"/><ellipse cx="14.5" cy="5.5" rx="2.2" ry="3"/><ellipse cx="18.5" cy="9" rx="2.2" ry="3"/><path d="M12 11c3.5 0 6.5 4.2 6.5 6.8 0 2.2-1.8 3.2-3.6 3.2-1.2 0-1.9-.6-2.9-.6s-1.7.6-2.9.6c-1.8 0-3.6-1-3.6-3.2C5.5 15.2 8.5 11 12 11z"/></svg>Beasts</button>
    <button data-view="fishing" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12c3-4 7-5 11-3l4-3v12l-4-3c-4 2-8 1-11-3z"/><circle cx="7.5" cy="11.5" r=".8" fill="currentColor"/></svg>Fishing</button>
    <button data-view="settings" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Hunter</button>
  </nav>
  <button class="charpill" id="charpill" aria-label="Change race"></button>
</header>
<main>
  <div id="loading" class="empty">Loading Forever data…</div>
  <section class="view on" id="view-quests" aria-label="Quests"></section>
  <section class="view" id="view-beasts" aria-label="Beasts"></section>
  <section class="view" id="view-fishing" aria-label="Fishing"></section>
  <section class="view" id="view-settings" aria-label="Settings"></section>
</main>
<div id="map-holder" style="height:300px"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
